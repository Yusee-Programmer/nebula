<!doctype html>
<meta charset="utf-8">
<title>Nebula Canvas2D — modern browser UI</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1120;
               font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: #94a3b8; }
  body { display: grid; place-items: center; gap: 12px; }
  canvas { display: block; border-radius: 8px; cursor: default; }
  #err { color: #f87171; max-width: 720px; white-space: pre-wrap; }
</style>

<canvas id="screen" width="700" height="680"></canvas>
<div id="status">loading nebula.wasm…</div>
<div id="err"></div>

<script type="module">
// The host side of the Canvas2D backend (proposal-v6 phase 3).
//
// Unlike examples/web_demo/index.html (WebCanvas: a shared raw pixel buffer,
// zero imports), this page IS the JS glue contract: every shape/text call
// crosses straight into a real ctx.roundRect/arc/fillText call here, so the
// module IMPORTS these under `env` instead of only exporting frame/init
// functions. Confirmed via `WebAssembly.Module.imports(module)` during
// development -- exactly `[{module:"env", name:"js_rounded_rect", ...}, ...]`.
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
const status = document.getElementById('status');

function unpack(color) {
  return [(color >> 16) & 255, (color >> 8) & 255, color & 255];
}

let mem = null;

const importObj = {
  env: {
    js_set_canvas_size(w, h) {
      cv.width = w;
      cv.height = h;
    },
    js_fill_rect(x, y, w, h, color, alpha) {
      const [r, g, b] = unpack(color);
      ctx.fillStyle = alpha >= 255 ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${alpha / 255})`;
      ctx.fillRect(x, y, w, h);
    },
    js_rounded_rect(x, y, w, h, radius, color) {
      const [r, g, b] = unpack(color);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, Math.max(0, radius));
      ctx.fill();
    },
    js_circle(cx, cy, r, color) {
      const [rr, gg, bb] = unpack(color);
      ctx.fillStyle = `rgb(${rr},${gg},${bb})`;
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(0, r), 0, Math.PI * 2);
      ctx.fill();
    },
    // `ptr`/`len` are plain i32 Numbers (Pointer[T]/c_int both cross the
    // wasm ABI that way -- see canvas2d_renderer.tr's own header on why
    // every extern here uses c_int, never Tauraro's own 64-bit `int`).
    js_fill_text(ptr, len, x, y, sizePx, color) {
      const [r, g, b] = unpack(color);
      const bytes = new Uint8Array(mem.buffer, ptr, len);
      const text = new TextDecoder().decode(bytes);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.font = `${sizePx}px ui-monospace, SFMono-Regular, Menlo, monospace`;
      ctx.textBaseline = 'top';
      ctx.fillText(text, x, y);
    },
  },
};

try {
  const { instance } = await WebAssembly.instantiateStreaming(fetch('nebula.wasm'), importObj);
  const ex = instance.exports;
  mem = ex.memory;

  // __heap_base is where static data ends -- handing the arena everything
  // above it is how the host gives Nebula memory without guessing an address.
  const heapBase = Number(ex.__heap_base.value ?? ex.__heap_base);
  const total = ex.memory.buffer.byteLength;
  ex.nebula_heap_init(heapBase, BigInt(total - heapBase));

  const W = cv.width, H = cv.height;
  ex.nebula_init(BigInt(W), BigInt(H));

  let mx = 0, my = 0, buttons = 0, key = 0, wheel = 0;
  const scale = () => cv.width / cv.getBoundingClientRect().width;
  cv.addEventListener('mousemove', e => {
    const r = cv.getBoundingClientRect(), s = scale();
    mx = Math.round((e.clientX - r.left) * s);
    my = Math.round((e.clientY - r.top) * s);
  });
  cv.addEventListener('mousedown', () => { buttons = 1; });
  window.addEventListener('mouseup', () => { buttons = 0; });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  // positive = up / scroll-toward-start, the same convention every desktop
  // tier's own wheel handling already uses (SdlCanvas.last_wheel_delta()).
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    wheel = e.deltaY < 0 ? 1 : -1;
  }, { passive: false });
  window.addEventListener('keydown', e => {
    if (e.key.length === 1) key = e.key.charCodeAt(0);
    else if (e.key === 'Backspace') key = 8;
    else if (e.key === 'Enter') key = 13;
  });

  function frame() {
    ex.nebula_frame(BigInt(W), BigInt(H), BigInt(mx), BigInt(my), BigInt(buttons), BigInt(key), BigInt(wheel));
    key = 0;      // one-shot per frame
    wheel = 0;    // one-shot per frame
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  setInterval(() => {
    status.textContent =
      `${ex.nebula_frames()} frames · arena ${ex.nebula_arena_used()} bytes · ` +
      `Canvas2D renderer (proposal-v6 phase 3) -- real browser antialiasing + text`;
  }, 500);
} catch (e) {
  status.textContent = 'failed to start';
  document.getElementById('err').textContent = e.stack || String(e);
}
</script>
