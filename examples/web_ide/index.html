<!doctype html>
<meta charset="utf-8">
<title>Nebula Code</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1120">
<link rel="manifest" href="manifest.json">
<style>
  /* Full-bleed, edge-to-edge -- no page chrome around the canvas at all, so
     the app reads as its own window rather than content embedded in a page.
     overflow:hidden on both stops a 1px scroll-bounce from ever showing a
     scrollbar next to a canvas that's already sized to fill exactly. */
  html, body { margin: 0; padding: 0; height: 100%; width: 100%;
               overflow: hidden; background: #0b1120;
               font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: #94a3b8; }
  canvas { display: block; }
  #err { position: fixed; bottom: 8px; left: 8px; color: #f87171;
         max-width: 900px; white-space: pre-wrap; font-size: 12px; z-index: 10; }
</style>

<canvas id="screen" tabindex="0"></canvas>
<div id="err"></div>

<script type="module">
// Host side of examples/web_ide. Same Canvas2D JS-import contract as every
// other *_web example (see examples/ide_demo_web's own index.html for the
// fuller per-function commentary on the drawing calls, not repeated here).
// Beyond that baseline, this page adds: a richer keydown map (arrow keys/
// Home/End/PageUp/PageDown/Delete/Tab -- see main.tr's key_*() functions
// for the exact code contract), HiDPI-correct canvas sizing, live window
// resize, and a cursor-shape bridge (see nebula_cursor_kind below).
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');

function unpack(color) {
  return [(color >> 16) & 255, (color >> 8) & 255, color & 255];
}

let mem = null;
// The blur/"foggy" look was the classic HTML5-canvas HiDPI bug: on a display
// with devicePixelRatio > 1 (basically every laptop screen now), a canvas
// whose PIXEL BUFFER (width/height attributes) matches its CSS display size
// 1:1 has fewer buffer pixels than the physical screen pixels it's stretched
// across, so the browser upscales the whole bitmap to fill them -- blurring
// EVERYTHING uniformly (text, fills, rects), not just edges. The fix: size
// the buffer to CSS-size * devicePixelRatio, keep the CSS size (style.width/
// height) at the LOGICAL size, and scale the 2D context so every existing
// draw call (still issued in logical coordinates by the wasm side) lands on
// the right physical pixels.
let logicalW = window.innerWidth, logicalH = window.innerHeight;
let lastDpr = 0;
function applyCanvasSize(w, h) {
  const dpr = window.devicePixelRatio || 1;
  // js_set_canvas_size is called every single frame (Canvas2DCanvas.init
  // runs inside nebula_frame), not just on real resizes -- assigning
  // cv.width/height REALLOCATES THE ENTIRE BACKING STORE every time, even
  // to the same value. At the old fixed 1100x700 that was wasteful but
  // survivable; once the canvas fills the whole window (this page's own
  // resize-to-fill change) that's a full-screen-sized GPU buffer realloc
  // 60 times a second, which is exactly what was hanging the tab ("not
  // responding"). Skip the expensive part entirely unless the logical size
  // or devicePixelRatio actually changed since last time.
  if (w === logicalW && h === logicalH && dpr === lastDpr) return;
  logicalW = w;
  logicalH = h;
  lastDpr = dpr;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  // setTransform (not scale): called every time the SIZE genuinely changes,
  // and scale() would compound onto whatever transform is already active --
  // setTransform always replaces it outright.
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

const importObj = {
  env: {
    js_set_canvas_size(w, h) {
      applyCanvasSize(w, h);
    },
    js_fill_rect(x, y, w, h, color, alpha) {
      const [r, g, b] = unpack(color);
      ctx.fillStyle = alpha >= 255 ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${alpha / 255})`;
      ctx.fillRect(x, y, w, h);
    },
    js_rounded_rect(x, y, w, h, radius, color) {
      const [r, g, b] = unpack(color);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, Math.max(0, radius));
      ctx.fill();
    },
    js_circle(cx, cy, r, color) {
      const [rr, gg, bb] = unpack(color);
      ctx.fillStyle = `rgb(${rr},${gg},${bb})`;
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(0, r), 0, Math.PI * 2);
      ctx.fill();
    },
    js_fill_text(ptr, len, x, y, sizePx, color) {
      const [r, g, b] = unpack(color);
      const bytes = new Uint8Array(mem.buffer, ptr, len);
      const text = new TextDecoder().decode(bytes);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.font = `${sizePx}px ui-monospace, SFMono-Regular, Menlo, monospace`;
      ctx.textBaseline = 'top';
      ctx.fillText(text, x, y);
    },
  },
};

try {
  const { instance } = await WebAssembly.instantiateStreaming(fetch('nebula.wasm'), importObj);
  const ex = instance.exports;
  mem = ex.memory;

  const heapBase = Number(ex.__heap_base.value ?? ex.__heap_base);
  const total = ex.memory.buffer.byteLength;
  ex.nebula_heap_init(heapBase, BigInt(total - heapBase));

  // W/H track the actual browser window -- ElectronJS-style fill-the-window
  // behavior, not a fixed canvas size. main.tr's own layout math (sidebar_w/
  // editor_x/etc) already recomputes every frame from whatever width/height
  // nebula_frame is called with, so resizing needs nothing on the wasm side
  // beyond passing the current size in -- this page just has to track it.
  let W = window.innerWidth, H = window.innerHeight;
  window.addEventListener('resize', () => {
    W = window.innerWidth;
    H = window.innerHeight;
  });
  ex.nebula_init(BigInt(W), BigInt(H));

  let mx = 0, my = 0, buttons = 0, key = 0, wheel = 0;
  // LOGICAL coordinates (the wasm side's whole world is 0..logicalW /
  // 0..logicalH) -- NOT cv.width/cv.height, which are now the DPI-scaled
  // physical buffer size and would put every click off by devicePixelRatio.
  cv.addEventListener('mousemove', e => {
    const r = cv.getBoundingClientRect();
    mx = Math.round((e.clientX - r.left) * (logicalW / r.width));
    my = Math.round((e.clientY - r.top) * (logicalH / r.height));
  });
  cv.addEventListener('mousedown', () => { buttons = 1; cv.focus(); });
  window.addEventListener('mouseup', () => { buttons = 0; });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    wheel = e.deltaY < 0 ? 1 : -1;
  }, { passive: false });

  // Key-code contract, matches main.tr's key_*() functions exactly:
  //   8=Backspace 9=Tab 13=Enter
  //   1001=Left 1002=Right 1003=Up 1004=Down
  //   1005=Home 1006=End 1007=PageUp 1008=PageDown 1009=Delete
  //   32..126 = printable ASCII (single character keys only)
  const KEY_MAP = {
    Backspace: 8, Tab: 9, Enter: 13,
    ArrowLeft: 1001, ArrowRight: 1002, ArrowUp: 1003, ArrowDown: 1004,
    Home: 1005, End: 1006, PageUp: 1007, PageDown: 1008, Delete: 1009,
  };
  const NAV_KEYS = new Set(Object.keys(KEY_MAP));
  cv.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return; // leave browser/OS shortcuts alone
    if (NAV_KEYS.has(e.key)) {
      key = KEY_MAP[e.key];
      e.preventDefault(); // Tab/arrows/PageUp must not move page focus or scroll
    } else if (e.key.length === 1) {
      key = e.key.charCodeAt(0);
    } else {
      return;
    }
  });

  // main.tr computes what's under the mouse every frame (it already knows
  // its own chrome layout for click routing) and exposes it here rather
  // than this page guessing at pixel rects independently -- 0=default,
  // 1=pointer (title bar/menu/tabs/sidebar), 2=text (the editor pane).
  const CURSOR_STYLES = ['default', 'pointer', 'text'];
  let lastCursor = -1;
  function frame() {
    ex.nebula_frame(BigInt(W), BigInt(H), BigInt(mx), BigInt(my), BigInt(buttons), BigInt(key), BigInt(wheel));
    key = 0;
    wheel = 0;
    const kind = Number(ex.nebula_cursor_kind());
    if (kind !== lastCursor) {
      cv.style.cursor = CURSOR_STYLES[kind] || 'default';
      lastCursor = kind;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
} catch (e) {
  document.getElementById('err').textContent = e.stack || String(e);
}
</script>
