<!doctype html>
<meta charset="utf-8">
<title>Nebula in the browser</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1120;
               font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: #94a3b8; }
  body { display: grid; place-items: center; gap: 12px; }
  canvas { display: block; border-radius: 8px; cursor: default; }
  #err { color: #f87171; max-width: 720px; white-space: pre-wrap; }
</style>

<canvas id="screen" width="900" height="560"></canvas>
<div id="status">loading nebula.wasm…</div>
<div id="err"></div>

<script type="module">
// The entire host side of the browser backend.
//
// There is no JS glue contract to maintain: the module imports NOTHING (no
// WASI), so instantiate() takes an empty import object. All this page does is
// hand Nebula a rectangle and forward input.
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d', { alpha: false });
const status = document.getElementById('status');

try {
  const { instance } = await WebAssembly.instantiateStreaming(fetch('nebula.wasm'), {});
  const ex = instance.exports;

  // __heap_base is where static data ends. Handing the arena everything above
  // it is how the host gives Nebula memory without guessing an address.
  const heapBase = ex.__heap_base.value ?? ex.__heap_base;
  const total = ex.memory.buffer.byteLength;
  ex.nebula_heap_init(heapBase, BigInt(total - heapBase));

  const W = cv.width, H = cv.height;
  // Returns a byte offset into linear memory. Nebula renders into those exact
  // bytes; nothing is copied or serialized crossing this boundary.
  // usize comes back as a BigInt (Tauraro usize is i64 in the wasm ABI, even
  // on wasm32) -- only Pointer[T] arrives as a plain i32 Number.
  const pixelPtr = Number(ex.nebula_init(BigInt(W), BigInt(H)));

  // The view must be rebuilt if memory ever grows, since growing detaches the
  // old ArrayBuffer and every view onto it.
  let view = null, image = null;
  function rebind() {
    view = new Uint8ClampedArray(ex.memory.buffer, pixelPtr, W * H * 4);
    image = new ImageData(view, W, H);
  }
  rebind();

  let mx = 0, my = 0, buttons = 0, key = 0;
  const scale = () => cv.width / cv.getBoundingClientRect().width;
  cv.addEventListener('mousemove', e => {
    const r = cv.getBoundingClientRect(), s = scale();
    mx = Math.round((e.clientX - r.left) * s);
    my = Math.round((e.clientY - r.top) * s);
  });
  cv.addEventListener('mousedown', () => { buttons = 1; });
  window.addEventListener('mouseup', () => { buttons = 0; });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (e.key.length === 1) key = e.key.charCodeAt(0);
    else if (e.key === 'Backspace') key = 8;
    else if (e.key === 'Enter') key = 13;
  });

  function frame() {
    if (view.buffer !== ex.memory.buffer) rebind();   // memory grew
    ex.nebula_frame(BigInt(W), BigInt(H), BigInt(mx), BigInt(my), BigInt(buttons), BigInt(key));
    key = 0;                                         // one-shot per frame
    ctx.putImageData(image, 0, 0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  setInterval(() => {
    status.textContent =
      `${ex.nebula_frames()} frames · arena ${ex.nebula_arena_used()} bytes · ` +
      `${(total / 1048576) | 0} MB linear memory · same engine as UEFI, SDL2 and bare metal`;
  }, 500);
} catch (e) {
  status.textContent = 'failed to start';
  document.getElementById('err').textContent = e.stack || String(e);
}
</script>
